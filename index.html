// 起動：新しい版が端末に保存されていればそちらを、なければこのファイルに入っている版を動かす
(function () {
  var meta = document.querySelector('meta[name="st-drill-version"]');
  var B = window.__ST_BOOT__ = { ver: meta.content, channel: meta.dataset.channel, builtin: meta.content, running: null };
  var started = false;
  function run(html, ver, stored) {
    if (started) return; started = true;
    B.running = ver; B.stored = !!stored;
    var doc = new DOMParser().parseFromString(html, "text/html");
    doc.head.querySelectorAll("style").forEach(function (n) { document.head.appendChild(document.importNode(n, true)); });
    var scripts = [].slice.call(doc.querySelectorAll("script"));
    scripts.forEach(function (s) { s.remove(); });
    document.body.innerHTML = doc.body.innerHTML;
    var failed = false, onErr = function () { failed = true; };
    if (stored) window.addEventListener("error", onErr);
    scripts.forEach(function (s) { var n = document.createElement("script"); n.textContent = s.textContent; document.body.appendChild(n); });
    if (stored) {
      window.removeEventListener("error", onErr);
      // 保存した版が動かなければ消して、ファイルに入っている版で起動し直す
      if (failed) { try { indexedDB.deleteDatabase("stDrillApp"); } catch (e) {} if (!sessionStorage.getItem("stBootRetry")) { sessionStorage.setItem("stBootRetry", "1"); location.reload(); } }
    }
  }
  function builtin() { run(JSON.parse(document.getElementById("st-app").textContent), B.builtin, false); }
  document.addEventListener("DOMContentLoaded", function () {
    var timer = setTimeout(builtin, 2000);
    try {
      var rq = indexedDB.open("stDrillApp", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("app"); };
      rq.onerror = function () { clearTimeout(timer); builtin(); };
      rq.onsuccess = function () {
        try {
          var g = rq.result.transaction("app").objectStore("app").get("latest");
          g.onsuccess = function () {
            clearTimeout(timer);
            var a = g.result;
            if (a && a.channel === B.channel && a.ver > B.builtin && a.html) run(a.html, a.ver, true); else builtin();
          };
          g.onerror = function () { clearTimeout(timer); builtin(); };
        } catch (e) { clearTimeout(timer); builtin(); }
      };
    } catch (e) { clearTimeout(timer); builtin(); }
  });
})();
</script>

   border: 1px solid var(--line); border-radius: 10px; }\n  mark { background: #f6e27a; color: #222; border-radius: 2px; padding: 0 1px; }\n  .big { font-size: 40px; font-weight: 700; }\n  .list-item { border-top: 1px solid var(--line); padding: 10px 0; }\n  .list-item:first-child { border-top: 0; }\n  .hidden { display: none !important; }\n  /* ホーム */\n  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 4px; }\n  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 4px; font-size: 13px; line-height: 1.3; background: var(--card); }\n  .tile b { font-size: 20px; font-weight: 400; }\n  .tile small { color: var(--muted); font-size: 12px; }\n  .opt { display: flex; align-items: center; gap: 8px; margin: 8px 0; }\n  .opt .seg button { font-size: 13px; padding: 5px 10px; }\n  .cntwrap { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px 0 4px; background: var(--btn); }\n  .cntwrap.on { background: var(--sel); border-color: var(--primary); }\n  .cntwrap input { width: 4.6em; font: inherit; font-size: 15px; padding: 3px 4px; border: 0; background: transparent; color: var(--text); text-align: right; }\n  .cntwrap input::-webkit-outer-spin-button, .cntwrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }\n  .cntwrap input[type=number] { -moz-appearance: textfield; appearance: textfield; }\n  .cntwrap input::placeholder { text-align: right; }\n  .opt > span { flex: none; width: 3.6em; color: var(--muted); font-size: 14px; font-weight: 600; }\n  .fldrow { display: flex; gap: 6px; align-items: stretch; margin: 6px 0; }\n  .fld { flex: 1; display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px 12px; background: var(--card); min-width: 0; }\n  .fld .name { flex: 1; font-weight: 600; min-width: 0; }\n  .fld .arrow { color: var(--muted); width: 1em; fle header class=\"app\">\n    <h1 id=\"homeLink\">ST国試ドリル<\/h1>\n    <span class=\"muted\" id=\"headerInfo\"><\/span>\n  <\/header>\n  <main id=\"view\"><\/main>\n<\/div>\n\n<dialog id=\"memoDialog\">\n  <div class=\"row\"><strong>メモ<\/strong><span class=\"spacer\"><\/span><span class=\"muted\" id=\"memoQ\"><\/span><\/div>\n  <textarea id=\"memoText\" placeholder=\"この問題についてのメモ（自動保存されます）\"><\/textarea>\n  <div class=\"row\" style=\"margin-top:8px\"><span class=\"spacer\"><\/span><button id=\"memoClose\" class=\"primary\">閉じる<\/button><\/div>\n<\/dialog>\n<div class=\"toast\" id=\"toast\"><\/div>\n<input type=\"file\" id=\"fileInput\" accept=\".json,application/json\" class=\"hidden\">\n\n<!-- 問題データ（同じフォルダの questions.js）。無くてもアプリは起動します -->\n<script>window.EDITION = \"share\";window.QUESTION_BANK = [];<\/script>\n<script>\n\"use strict\";\n\n// ---------- クラス設定（tools/set_class.py で書き換え） ----------\n// url：集計サーバー（Google Apps Script）の URL。空なら記録はこの端末だけ。passHash：合言葉のハッシュ。空ならログインなし\n// adminHash：管理者の合言葉のハッシュ。students：ログインできる学籍番号（空なら誰でも）。adminId：管理者の学籍番号\n// 管理者画面が使えるのは adminId の人が管理者の合言葉でログインしたときだけ\nconst CLASS = { url: \"https://script.google.com/macros/s/AKfycbwRBqwL8vLCffzN3uFGdoW8dBtlZ5F3i78o_eSrzktdXsaxSHtb57gVKtaYgRSOJqw/exec\", passHash: \"\", adminHash: \"\", students: [], adminId: \"2024R011\" };\n\n// ---------- 保存 ----------\nconst KEY = \"stDrill_v1\";\nconst blank = () => ({ progress: {}, retry: [], excluded: [], memos: {}, session: null, imported: [], settings: { count: 20, order: \"random\", filter: \"all\" }, account: null, outbox: [], ud: { rev: 0, m: {}, dirty: {}, seeded: false } });\nlet S;\ntry { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || \"{}\")); } catch (e) { S = blank(); }\nlet udReady = false;  // 下の「リトライ・除外・メモ・自己評価の同期」が読み込まれるまでは差分を取らない\nfunction save() {\n  if (udReady && S.account && CLASS.url) { try { if (udDiff(Date.now())) syncSoon(); } catch (e) { console.error(\"同期の準備エラー\", e); } }\n  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast(\"保存できませんでした（ブラウザの設定を確認してください）\"); } }\n\n// ---------- 問題 ----------\nfunction normalize(q, i) {\n  return {\n    id: String(q.id ?? (\"q\" + i)),\n    field: q.field || \"\",\n    category: q.category || \"未分類\",\n    topic: q.topic || \"\",\n    keywords: Array.isArray(q.keywords) ? q.keywords : String(q.keywords || \"\").split(/\\s+/).filter(Boolean),\n    note: q.note || \"\",\n    anyOf: !!q.anyOf,\n    source: q.source || \"\",\n    stem: q.stem || \"\",\n    statements: Array.isArray(q.statements) ? q.statements : [],\n    choices: Array.isArray(q.choices) ? q.choices : [],\n    answer: (Array.isArray(q.answer) ? q.answer : [q.answer]).map(Number).sort((a, b) => a - b),\n    explanation: q.explanation || \"\",\n    bookExpl: q.bookExpl || \"\",\n    bookRef: q.bookRef || \"\",\n    img: typeof q.img === \"string\" && q.img.startsWith(\"data:image/\") ? q.img : \"\"\n  };\n}\nlet BANK = [], BYID = {};\nfunction loadBank() {\n  const base = Array.isArray(window.QUESTION_BANK) ? window.QUESTION_BANK : [];\n  const map = new Map();\n  base.concat(S.imported || []).forEach((q, i) => { const n = normalize(q, i); map.set(n.id, n); });\n  BANK = [...map.values()];\n  BYID = Object.fromEntries(BANK.map(q => [q.id, q]));\n}\nloadBank();\n// カテゴリは「分野|カテゴリ」で区別する（予測問題にも本編と同じ名前のカテゴリがあるため）\nconst ckey = q => (q.field || \"\") + \"|\" + q.category;\nconst categories = () => [...new Set(BANK.map(ckey))];\nconst YOSOKU = \"予測問題200問\";\nconst catLabel = k => { const [f, c] = k.split(\"|\"); return f === YOSOKU ? \"予測・\" + c : c; };\n\n// ---------- 小物 ----------\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s).replace(/[&<>\"']/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst LETTERS = \"abcdefghij\";\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst pct = (c, n) => n ? Math.round(c / n * 100) : null;\nconst has = (arr, id) => arr.includes(id);\nconst toggleIn = (key, id) => { const a = S[key]; const i = a.indexOf(id); i >= 0 ? a.splice(i, 1) : a.push(id); save(); return i < 0; };\nfunction toast(msg, ms) { const t = $(\"#toast\"); t.textContent = msg; t.classList.add(\"show\"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove(\"show\"), ms || 1800); }\nfunction setHeader(s) { $(\"#headerInfo\").textContent = s || \"\"; }\nfunction catStats(key) {\n  const qs = BANK.filter(q => !key || ckey(q) === key);\n  let tried = 0, att = 0, cor = 0;\n  qs.forEach(q => { const p = S.progress[q.id]; if (p) { tried++; att += p.attempts; cor += p.correct; } });\n  return { total: qs.length, tried, rate: pct(cor, att) };\n}\nfunction sameAns(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }\n// anyOf：正答が2つある問題。どちらか1つ、または両方を選べば正解\nfunction isCorrect(q, mine) { return q.anyOf ? mine.length > 0 && mine.every(n => q.answer.includes(n)) : sameAns(mine, q.answer); }\n\n// ---------- ホーム ----------\nlet pickedCats = new Set();\n// ---------- 分野別正答率 ----------\nconst KISO_FIELDS = [\"基礎医学\", \"臨床医学・歯科医学\", \"心理学\", \"言語・音声・音響\", \"社会福祉・教育\", \"リハビリテーション概論・関係法規\"];\nfunction statsOf(qs) {\n  let tried = 0, att = 0, cor = 0;\n  qs.forEach(q => { const p = S.progress[q.id]; if (p && p.attempts) { tried++; att += p.attempts; cor += p.correct; } });\n  return { total: qs.length, tried, att, rate: att ? cor / att * 100 : null };\n}\n// 正答率の色：60%以上＝緑、50〜60%＝黄、50%未満＝赤、未解答＝灰色\nconst rateCls = r => r == null ? \"none\" : r >= 60 ? \"ok\" : r >= 50 ? \"mid\" : \"ng\";\n// 1行：名前・解いた問題数・正答率、その下に棒（縦線が60%）。fold＝押すと開く行（open で ▾）、sub＝字下げした科目の行\nfunction statRow(name, st, total, o = {}) {\n  const r = st.rate, c = rateCls(r);\n  return `<div class=\"srow ${total ? \"total\" : \"\"} ${o.fold != null ? \"fold\" : \"\"} ${o.sub ? \"sub\" : \"\"}\" ${o.fold != null ? `data-sopen=\"${esc(o.fold)}\"` : \"\"}>\n    <div class=\"l1\"><span class=\"nm\">${o.open != null ? `<span class=\"chev\">${o.open ? \"▾\" : \"▸\"}<\/span>` : \"\"}${esc(name)}${o.note ? `<div class=\"cnt\">${esc(o.note)}<\/div>` : \"\"}<\/span>\n    <span class=\"cnt\">${st.tried}/${st.total}問<\/span><span class=\"rt r-${c}\">${r == null ? \"未解答\" : r.toFixed(1) + \"%\"}<\/span>${o.btn || \"\"}<\/div>\n    <div class=\"sbar\">${r == null ? \"\" : `<i class=\"b-${c}\" style=\"width:${r}%\"><\/i>`}<b><\/b><\/div><\/div>`;\n}\nlet statsOpen = new Set(), statsSort = \"field\";\nfunction renderStats(keepScroll) {\n  const y = window.scrollY;\n  document.querySelector(\".wrap\").classList.add(\"wide\");\n  setHeader(\"\");\n  const all = [...new Set(BANK.map(q => q.field || \"\"))];\n  const kiso = KISO_FIELDS.filter(f => all.includes(f));\n  const senmon = all.filter(f => !KISO_FIELDS.includes(f) && f !== YOSOKU);\n  const ofFields = fs => BANK.filter(q => fs.includes(q.field || \"\"));\n  const catsOf = f => [...new Set(BANK.filter(q => (q.field || \"\") === f).map(q => q.category))];\n  const col = (title, fields) => {\n    let h = `<div><div class=\"shead\">${title}<\/div>`;\n    fields.forEach(f => {\n      const fq = BANK.filter(q => (q.field || \"\") === f), cats = catsOf(f), name = f === YOSOKU ? \"予測問題\" : f || \"その他\";\n      if (cats.length < 2) { h += statRow(name, statsOf(fq), true); return; }\n      const open = statsOpen.has(f);\n      h += statRow(name, statsOf(fq), true, { fold: f, open });\n      if (open) cats.forEach(c => { h += statRow(c, statsOf(fq.filter(q => q.category === c)), false, { sub: true }); });\n    });\n    return h + `<\/div>`;\n  };\n  const sum = (label, qs) => { const st = statsOf(qs); return `<div><div class=\"s\">${label}<\/div><div class=\"v r-${rateCls(st.rate)}\" style=\"font-size:26px;font-weight:700\">${st.rate == null ? \"－\" : Math.round(st.rate) + \"%\"}<\/div><div class=\"s\">${st.tried}/${st.total}問 解答<\/div><\/div>`; };\n  const folds = [...kiso, ...senmon, ...(all.includes(YOSOKU) ? [YOSOKU] : [])].filter(f => catsOf(f).length > 1);\n  const allOpen = folds.every(f => statsOpen.has(f));\n  let body;\n  if (statsSort === \"low\") {\n    // 科目ごとに正答率の低い順。予測問題は除き、まだ解いていない科目は最後\n    const rows = categories().filter(k => !k.startsWith(YOSOKU + \"|\")).map(k => ({ k, st: statsOf(BANK.filter(q => ckey(q) === k)) }));\n    rows.sort((a, b) => (a.st.rate == null) - (b.st.rate == null) || (a.st.rate ?? 0) - (b.st.rate ?? 0) || b.st.total - a.st.total);\n    body = `<div class=\"card\" style=\"padding:4px 12px\">${rows.map(({ k, st }) => { const [f, c] = k.split(\"|\");\n      return statRow(c, st, false, { note: f !== c ? f : \"\", btn: `<button class=\"small\" data-tipcat=\"${esc(k)}\" style=\"margin-left:4px\">10問<\/button>` }); }).join(\"\")}<\/div>\n      <p class=\"muted\">「10問」を押すと、その科目から まちがえたまま → 未解答 → そのほか の順に10問出題します。<\/p>`;\n  } else {\n    body = `<div class=\"stats2\">${col(\"基礎\", kiso)}${col(\"専門\", senmon)}<\/div>${all.includes(YOSOKU) ? `<div class=\"stats2\">${col(\"予測問題\", [YOSOKU])}<\/div>` : \"\"}`;\n  }\n  $(\"#view\").innerHTML = `<div class=\"row\"><h2 style=\"margin:0\">分野別正答率<\/h2><span class=\"spacer\"><\/span><button class=\"small\" data-act=\"home\">ホームへ<\/button><\/div>\n    <div class=\"ssum\">${sum(\"全体（過去問）\", ofFields([...kiso, ...senmon]))}${sum(\"基礎\", ofFields(kiso))}${sum(\"専門\", ofFields(senmon))}<\/div>\n    <div class=\"row\" style=\"gap:8px\"><div class=\"seg\"><button class=\"${statsSort === \"field\" ? \"on\" : \"\"}\" data-ssort=\"field\">分野ごと<\/button><button class=\"${statsSort === \"low\" ? \"on\" : \"\"}\" data-ssort=\"low\">苦手な順<\/button><\/div>\n      <span class=\"spacer\"><\/span>${statsSort === \"field\" ? `<button class=\"small\" data-act=\"stats-all\">${allOpen ? \"すべて閉じる\" : \"すべて開く\"}<\/button>` : \"\"}<\/div>\n    <div class=\"slegend\"><span><i class=\"b-ok\"><\/i>60%以上<\/span><span><i class=\"b-mid\"><\/i>50〜60%<\/span><span><i class=\"b-ng\"><\/i>50%未満<\/span><span>縦線＝合格の目安60%<\/span><\/div>\n    <p class=\"muted\" style=\"margin:4px 0\">正答率＝正解した回数÷解答した回数（通算）。「12/40問」は解いた問題数／収録問題数。${statsSort === \"field\" ? \"▸ の分野は押すと科目ごとに開きます。\" : \"\"}<\/p>\n    ${body}${habitHtml()}`;\n  window.scrollTo(0, keepScroll ? y : 0);\n}\n// ---------- 学習アドバイス（試験版） ----------\n// 自分の解答記録から「どこから勉強するか」の目安を出す。端末の中だけで計算する（予測問題は除く）。\n// 出題の多さは本に載っている過去10年分の問題数で見る。合格の目安は60%\nfunction tipData() {\n  const qs = BANK.filter(q => q.field !== YOSOKU), all = qs.length;\n  const by = {};\n  qs.forEach(q => {\n    const k = ckey(q), c = by[k] || (by[k] = { k, n: 0, tried: 0, att: 0, cor: 0, wrong: 0, catt: 0, ccor: 0 });\n    c.n++;\n    const p = S.progress[q.id]; if (p && p.attempts) { c.tried++; c.att += p.attempts; c.cor += p.correct; if (p.last === false) c.wrong++; }\n    const sh = SHARED.stats && SHARED.stats[q.id]; if (sh) { c.catt += sh[0]; c.ccor += sh[1]; }\n  });\n  const cats = Object.values(by).map(c => Object.assign(c, { w: c.n / all, rate: c.att ? c.cor / c.att * 100 : null, cls: c.catt ? c.ccor / c.catt * 100 : null, cov: c.tried / c.n }));\n  return { qs, cats };\n}\nfunction renderTips() {\n  document.querySelector(\".wrap\").classList.remove(\"wide\");\n  setHeader(\"学習アドバイス\");\n  const { qs, cats } = tipData();\n  const att = cats.reduce((a, c) => a + c.att, 0), cor = cats.reduce((a, c) => a + c.cor, 0), tried = cats.reduce((a, c) => a + c.tried, 0);\n  const wrong = cats.reduce((a, c) => a + c.wrong, 0);\n  const r1 = v => v == null ? \"－\" : Math.round(v) + \"%\";\n  const btn = (k, label) => `<button class=\"small primary\" data-tipcat=\"${esc(k)}\">${label || \"この分野で10問\"}<\/button>`;\n  const item = (title, why, k) => `<div class=\"list-item\"><div class=\"row\"><strong>${esc(title)}<\/strong><span class=\"spacer\"><\/span>${k ? btn(k) : \"\"}<\/div><div class=\"muted\" style=\"font-size:14px\">${why}<\/div><\/div>`;\n  let h = `<div class=\"row\"><h2 style=\"margin:0\">学習アドバイス <span class=\"muted\" style=\"font-size:14px;font-weight:normal\">試験版<\/span><\/h2><span class=\"spacer\"><\/span><button class=\"small\" data-act=\"home\">ホームへ<\/button><\/div>\n    <p class=\"muted\">この端末の解答記録から自動で出した目安です（予測問題は除く）。「出題数」は本に載っている過去10年分の問題数で、多い分野ほど本番でも出やすいと考えています。<\/p>`;\n  // 全体\n  h += `<div class=\"card\"><div class=\"grid2\" style=\"text-align:center\">\n    <div><div class=\"muted\">解いた問題<\/div><div class=\"big\" style=\"font-size:26px\">${tried}<span style=\"font-size:15px\">／${qs.length}問<\/span><\/div><\/div>\n    <div><div class=\"muted\">通算の正答率<\/div><div class=\"big\" style=\"font-size:26px\">${r1(att ? cor / att * 100 : null)}<\/div><\/div><\/div><\/div>`;\n  if (att < 30) {\n    h += `<div class=\"card\"><strong>まずは全体を広く解いてみましょう<\/strong><p class=\"muted\" style=\"margin:6px 0 10px\">記録がまだ少ないので（${att}回）、苦手な分野がまだ分かりません。全分野からランダムに50問ほど解くと、ここに優先して勉強したい分野が出てきます。<\/p>\n      <button class=\"primary\" data-act=\"tip-random\">全分野からランダムに50問<\/button><\/div>`;\n    $(\"#view\").innerHTML = h; return window.scrollTo(0, 0);\n  }\n  // 0. 6割への道：分野ごとの正答率を出題数の割合で重みづけして本番の得点（200問）を見積もり、\n  //    安定して超えるための目標（66%＝132点、ぶれても6割を割らない余裕）までに上げたい分野を順に出す\n  const all = att ? cor / att * 100 : 0;\n  const est = c => c.att >= 3 ? c.rate : all;  // ほとんど解いていない分野は通算の正答率で仮に見積もる\n  const pred = cats.reduce((a, c) => a + c.w * est(c), 0), GOAL = 66, TARGET = 75;\n  const recent = allHist().sort((a, b) => a.r.t - b.r.t).slice(-100), chunks = [];\n  for (let i = 0; i + 20 <= recent.length; i += 20) chunks.push(recent.slice(i, i + 20).filter(x => x.r.ok).length / 20 * 100);\n  const over = chunks.filter(v => v >= 60).length;\n  const plan = []; let p2 = pred;\n  cats.filter(c => est(c) < TARGET).map(c => ({ c, gain: c.w * (TARGET - est(c)) })).sort((a, b) => b.gain - a.gain)\n    .forEach(x => { if (p2 < GOAL && plan.length < 5) { plan.push(x); p2 += x.gain; } });\n  const pts = v => Math.round(v * 2);  // 200問中の点数\n  h += `<h2>安定して6割を超えるには<\/h2><div class=\"card\">\n    <div class=\"row\"><div><div class=\"muted\">今の記録からの予想得点<\/div><div class=\"big\" style=\"font-size:30px;color:${pred >= 60 ? \"var(--ok)\" : \"var(--ng)\"}\">${pts(pred)}<span style=\"font-size:16px\">／200点（${r1(pred)}）<\/span><\/div><\/div><span class=\"spacer\"><\/span>\n      <div style=\"text-align:right\"><div class=\"muted\">合格の目安<\/div><div style=\"font-size:18px\">120点（60%）<\/div><\/div><\/div>\n    <div class=\"muted\" style=\"font-size:13px;margin-top:4px\">分野ごとの正答率に、その分野の出題の多さをかけて足した見積もりです。ほとんど解いていない分野は通算の正答率（${r1(all)}）で仮に計算しています。<\/div>`;\n  if (chunks.length >= 2) h += `<div style=\"margin-top:10px\"><div class=\"muted\" style=\"font-size:14px\">最近の20問ごとの正答率（古い順）<\/div>\n    <div class=\"row\" style=\"gap:6px;margin-top:4px\">${chunks.map(v => `<span class=\"pill\" style=\"padding:2px 8px;border-radius:8px;background:${v >= 60 ? \"var(--sel)\" : \"var(--btn)\"};border:1px solid ${v >= 60 ? \"var(--primary)\" : \"var(--line)\"}\">${Math.round(v)}%<\/span>`).join(\"\")}<\/div>\n    <div style=\"font-size:14px;margin-top:4px\">${over === chunks.length ? \"どの回も6割を超えています。安定してきました。\" : `6割を超えたのは ${chunks.length}回中 ${over}回。${over * 2 >= chunks.length ? \"あと一歩で安定します。\" : \"まだ波があります。\"}`}<\/div><\/div>`;\n  h += pred >= GOAL && (chunks.length < 2 || over === chunks.length)\n    ? `<p style=\"margin:10px 0 0;font-size:15px\">予想得点は余裕をもって6割を超えています（目標 ${pts(GOAL)}点）。この先は「まちがえたままの問題」をなくすことと、解いていない問題を減らすことで、本番のぶれに備えましょう。<\/p>`\n    : `<p style=\"margin:10px 0 6px;font-size:15px\">本番で多少ぶれても6割を割らないように、<strong>${pts(GOAL)}点（${GOAL}%）<\/strong>を目標にします。${plan.length ? \"次の分野をそれぞれ\" + TARGET + \"%まで上げると、\" + (p2 >= GOAL ? \"目標に届きます\" : \"目標にかなり近づきます\") + \"。上から順にやるのが効率的です。\" : \"\"}<\/p>\n      ${plan.map(({ c, gain }) => item(catLabel(c.k), `${c.att >= 3 ? \"正答率 \" + r1(c.rate) : \"まだほとんど解いていない\"} → ${TARGET}% にすると <strong>＋${Math.max(1, pts(gain))}点<\/strong>（出題数 ${c.n}問）`, c.k)).join(\"\")}\n      ${plan.length ? `<div class=\"muted\" style=\"font-size:13px;margin-top:6px\">合計で約 ＋${pts(p2 - pred)}点 → 予想 ${pts(p2)}点<\/div>` : \"\"}`;\n  // 問題の形ごとの正答率（5択・組合せ・2つ選べ）\n  const kind = q => q.statements.length ? \"組合せ（a〜e）\" : q.answer.length > 1 && !q.anyOf ? \"2つ選べ\" : \"5択\";\n  const kinds = {}; qs.forEach(q => { const p = S.progress[q.id]; if (!p || !p.attempts) return; const k = kinds[kind(q)] || (kinds[kind(q)] = [0, 0]); k[0] += p.attempts; k[1] += p.correct; });\n  const kl = Object.entries(kinds).filter(([, v]) => v[0] >= 10).map(([k, v]) => [k, v[1] / v[0] * 100]).sort((a, b) => a[1] - b[1]);\n  if (kl.length >= 2 && kl[kl.length - 1][1] - kl[0][1] >= 10) h += `<div style=\"font-size:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)\">問題の形でみると「${esc(kl[0][0])}」の正答率（${r1(kl[0][1])}）が低めです（${kl.map(([k, v]) => esc(k) + \" \" + r1(v)).join(\"・\")}）。${kl[0][0].startsWith(\"組合せ\") ? \"a〜e の文を1つずつ○×で判断し、確実に×と言える文から選択肢を消していくと取りこぼしが減ります。\" : kl[0][0] === \"2つ選べ\" ? \"2つとも合って1点なので、1つ目に自信があっても2つ目を最後まで比べましょう。\" : \"選択肢を最後まで読み、消去法で2つに絞ってから選ぶ練習を。\"}<\/div>`;\n  h += `<\/div>`;\n  // 1. 優先して勉強したい分野：正答率が低く、出題数が多いほど上\n  const weak = cats.filter(c => c.att >= 5 && c.rate < 70).map(c => Object.assign(c, { score: c.w * (1 - c.rate / 100) * (c.rate < 60 ? 1.5 : 1) })).sort((a, b) => b.score - a.score).slice(0, 3);\n  h += `<h2>正答率が低い分野<\/h2><div class=\"card\">`;\n  h += weak.length ? weak.map((c, i) => item(`${i + 1}. ${catLabel(c.k)}`, `正答率 ${r1(c.rate)}${c.rate < 60 ? \"（合格の目安60%より下）\" : \"\"}・出題数 ${c.n}問・まちがえたままの問題 ${c.wrong}問`, c.k)).join(\"\")\n    : cats.some(c => c.att >= 5) ? `<span class=\"muted\">正答率が70%を下回る分野はありません。いい調子です。下の「まだ手をつけていない分野」を広げましょう。<\/span>`\n    : `<span class=\"muted\">分野ごとの記録がまだ少ないので（1つの分野で5回以上解くと出ます）、苦手な分野はまだ分かりません。上の分野から解いていきましょう。<\/span>`;\n  h += `<\/div>`;\n  // 2. まだ手をつけていない分野：出題数が多いのに、解いた割合が低い\n  const fresh = cats.filter(c => c.cov < 0.3 && c.n >= 10).sort((a, b) => b.n * (1 - b.cov) - a.n * (1 - a.cov)).slice(0, 3);\n  if (fresh.length) h += `<h2>まだ手をつけていない分野<\/h2><div class=\"card\">${fresh.map(c => item(catLabel(c.k), `出題数 ${c.n}問のうち、解いた \"}（${r1(Math.max(kiso, senmon))}）より低めです。${kiso < senmon ? \"基礎\" : \"専門\"}の分野を少し多めに。`);\n  notes.push(days >= 5 ? `この7日間で ${days}日 解いています。この調子で続けましょう。` : `この7日間で解いたのは ${days}日 です。1日10問でも毎日続けると、忘れにくくなります。`);\n  if (avg != null) notes.push(avg > 90 ? `1問あたり平均 ${fmtSec(avg)}。迷う問題に時間をかけすぎているかもしれません。迷ったらリトライに入れて先に進み、あとで解き直す練習も。` : `1問あたり平均 ${fmtSec(avg)}。テンポよく解けています。`);\n  h += `<h2>ひとこと<\/h2><div class=\"card\">${notes.map(t => `<div style=\"padding:4px 0\">・${esc(t)}<\/div>`).join(\"\")}<\/div>`;\n  // 7. 解説の読み方（解説を見ていた時間。2026/10/27 から記録）\n  const ex = allHist().filter(x => x.r.exp != null && x.q.field !== YOSOKU);\n  if (ex.length >= 10) {\n    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;\n    const exNg = ex.filter(x => !x.r.ok), exOk = ex.filter(x => x.r.ok);\n    const quick = exNg.filter(x => x.r.exp < 5).length;\n    // まちがえたあと解説をよく読んだ（20秒以上）問題と、ほとんど読まなかった問題で、次に解いたときの正答率を比べる\n    const after = { long: [0, 0], short: [0, 0] };\n    Object.values(S.progress).forEach(p => { const hs = (p.hist || []).slice().sort((a, b) => a.t - b.t);\n      hs.forEach((r, i) => { const nx = hs[i + 1]; if (r.ok || r.exp == null || !nx) return; const b = after[r.exp >= 20 ? \"long\" : \"short\"]; b[0]++; if (nx.ok) b[1]++; }); });\n    const en = [];\n    en.push(`解説を見ていた時間の平均は、まちがえた問題で ${fmtSec(mean(exNg.map(x => x.r.exp)))}、正解した問題で ${fmtSec(mean(exOk.map(x => x.r.exp)))} です。`);\n    if (exNg.length >= 5) en.push(quick / exNg.length >= 0.3\n      ? `まちがえた問題のうち ${Math.round(quick / exNg.length * 100)}% は、解説を5秒もたたずに閉じています。まちがえた問題こそ、なぜその答えになるのか、ほかの選択肢のどこが違うのかまで読むと、次に同じ論点が出たとき解けるようになります。`\n      : `まちがえた問題の解説をきちんと読めています（5秒未満で閉じたのは ${Math.round(quick / exNg.length * 100)}%）。`);\n    if (after.long[0] >= 5 && after.short[0] >= 5) en.push(`まちがえたあと解説を20秒以上読んだ問題は、次に解いたとき ${Math.round(after.long[1] / after.long[0] * 100)}% 正解、ほとんど読まなかった問題は ${Math.round(after.short[1] / after.short[0] * 100)}% 正解でした。`);\n    const slowNg = cats.filter(c => c.att >= 5 && c.rate < 60).map(c => ({ c, e: mean(exNg.filter(x => ckey(x.q) === c.k).map(x => x.r.exp)) })).filter(x => x.e != null && x.e >= 40).sort((a, b) => b.e - a.e).slice(0, 2);\n    if (slowNg.length) en.push(`${slowNg.map(x => `${catLabel(x.c.k)}（平均 ${fmtSec(x.e)}）`).join(\"・\")} は、まちがえた問題の解説をじっくり読んでいるのに正答率が6割に届いていません。解説だけでは足りない分野なので、教科書や授業ノートで基本から確認するのがおすすめです。`);\n    h += `<h2>解説の読み方<\/h2><div class=\"card\">${en.map(t => `<div style=\"padding:4px 0\">・${esc(t)}<\/div>`).join(\"\")}<div class=\"muted\" style=\"font-size:13px;margin-top:4px\">解説を表示していた時間（別のアプリにいた間は数えません）。2026/10/27 から記録しています。<\/div><\/div>`;\n  }\n  $(\"#view\").innerHTML = h;\n  window.scrollTo(0, 0);\n}\n// その分野から10問：まちがえたまま → まだ解いていない → そのほか の順に選ぶ\nfunction tipStart(k) {\n  const qs = BANK.filter(q => ckey(q) === k && !S.excluded.includes(q.id)), st = q => S.progress[q.id];\n  const g1 = qs.filter(q => st(q) && st(q).last === false), g2 = qs.filter(q => !st(q) || !st(q).attempts), g3 = qs.filter(q => !g1.includes(q) && !g2.includes(q));\n  startSession([...shuffle(g1), ...shuffle(g2), ...shuffle(g3)].slice(0, 10).map(q => q.id), catLabel(k) + \"（アドバイス）\");\n}\n// ---------- 回答の傾向 ----------\nconst fmtSec = v => { if (v == null) return \"－\"; v = Math.round(v); return v < 60 ? `${v}秒` : `${Math.floor(v / 60)}分${String(v % 60).padStart(2, \"0\")}秒`; };\nfunction allHist() {\n  const rows = [];\n  Object.entries(S.progress).forEach(([id, p]) => { const q = BYID[id]; if (q) (p.hist || []).forEach(r => rows.push({ q, r })); });\n  return rows;\n}\nfunction habitHtml() {\n  const rows = allHist();\n  if (!rows.length) return \"\";\n  const timed = rows.filter(x => x.r.sec != null);\n  const avg = a => a.length ? a.reduce((s, x) => s + x.r.sec, 0) / a.length : null;\n  const rate = a => a.length ? `${pct(a.filter(x => x.r.ok).length, a.length)}%` : \"－\";\n  const tbl = (head, list) => `<table class=\"hist\"><tr>${head.map(h => `<th>${h}<\/th>`).join(\"\")}<\/tr>${list.map(r => `<tr>${r.map(c => `<td>${c}<\/td>`). v class=\"flags\" style=\"margin-top:10px\">${q.keywords.map(k => `<span class=\"tag\">${esc(k)}<\/span>`).join(\"\")}<\/div>` : \"\"}\n      ${q.note ? `<div class=\"muted\" style=\"margin-top:8px\">※ ${esc(q.note)}<\/div>` : \"\"}\n      <div style=\"margin-top:10px;text-align:right\"><button class=\"small\" data-act=\"report\">📝 解説を報告する<\/button><\/div>\n      <button class=\"primary\" data-act=\"next\" style=\"width:100%;margin-top:12px\">${s.idx + 1 < s.ids.length ? \"次の問題 ▶\" : \"結果を見る ▶\"}<\/button>\n    <\/div>`;\n    h += histHtml(q, p);\n  }\n\n  h += `<div class=\"card\"><div class=\"meta\">${esc(q.source)}${q.topic ? `<br>【${esc(q.topic)}】` : \"\"}<\/div><div class=\"stem\">${esc(q.stem)}<\/div>`;\n  if (q.img) h += `<div class=\"fig\" data-fig title=\"タップで拡大\"><img src=\"${q.img}\" alt=\"問題の図\"><\/div>`;\n  q.statements.forEach((t, i) => { h += `<div class=\"stmt\">${LETTERS[i]}. ${esc(t)}<\/div>`; });\n  if (multi && !done) h += `<div class=\"muted\" style=\"margin-top:6px\">※ ${q.answer.length}つ選んでください<\/div>`;\n  if (q.anyOf && !done) h += `<div class=\"muted\" style=\"margin-top:6px\">※ 正答が${q.answer.length}つある問題です（どちらか1つ、または両方を選べば正解）<\/div>`;\n  h += `<div class=\"choices\">`;\n  order.forEach((oi, i) => {\n    const d = i + 1, n = oi + 1, c = q.choices[oi];  // d：表示の番号、n：元の番号\n    let cls = \"\";\n    if (done) { if (q.answer.includes(n)) cls = \"correct\"; else if (mine.includes(n)) cls = \"wrong\"; }\n    else if (selected.includes(d)) cls = \"on\";\n    h += `<button class=\"choice ${cls}\" data-choice=\"${d}\" ${done ? \"disabled style='opacity:1'\" : \"\"}>${d}. ${esc(c)}${done && shuffled ? ` <span class=\"muted\">（元の${n}）<\/span>` : \"\"}<\/button>`;\n  });\n  h += `<\/div><\/div>`;\n\n  // 解答・次へ・前へは画面の下に固定（長い問題でもスクロールせずに押せる）\n  h += `<div class=\"startbar\"><div class=\"in two\"><button data-act=\"prev\" ${s.idx === 0 ? \"disabled\" : \"\"}>◀ 前へ<\/button>\n      ${done ? `<button class=\"primary\" data-act=\"next\">${s.idx + 1 < s.ids.length ? \"次の問題 ▶\" : \"結果を見る ▶\"}<\/button>`\n             : `<button class=\"primary\" data-act=\"answer\">${selected.length ? \"解答する\" : \"解答・解説\"}<\/button>`}<\/div><\/div>`;\n  h += `<div class=\"grid2\">\n      <button data-act=\"finish\">採点して終了<\/button>\n      <button data-act=\"suspend\">演習を中断<\/button>\n      <button class=\"${has(S.retry, q.id) ? \"on\" : \"\"}\" data-act=\"retry\">${has(S.retry, q.id) ? \"★ リトライ登録中\" : \"☆ リトライに追加\"}<\/button>\n      <button class=\"${has(S.excluded, q.id) ? \"on\" : \"\"}\" data-act=\"exclude\">${has(S.excluded, q.id) ? \"演習除外中\" : \"演習除外にする\"}<\/button>\n    <\/div>`;\n  h += `<h2>この演習の解答状況<\/h2><div class=\"chips\">${chipsHtml(s)}<\/div><div style=\"height:84px\"><\/div>`;\n  navPush();\n  $(\"#view\").innerHTML = h;\n  window.scrollTo(0, keepScroll ? y : 0);\n}\nconst EVALS = [\"◎\", \"○\", \"△\", \"×\", \"－\"];\nfunction fmtDate(t) { const d = new Date(t); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, \"0\")}/${String(d.getDate()).padStart(2, \"0\")}`; }\nfunction histHtml(q, p) {\n  const hist = (p && p.hist) || [];\n  const cur = hist.length ? hist[hist.length - 1].ev || \"\" : \"\";\n  let h = `<div class=\"card\"><div class=\"row\"><strong>自己評価<\/strong><span class=\"muted\">（自信の度合いを記録）<\/span><\/div>\n    <div class=\"evals\">${EVALS.map(e => `<button class=\"${cur === e ? \"on\" : \"\"}\" data-ev=\"${e}\">${e}<\/button>`).join(\"\")}<\/div>\n    <h2 style=\"font-size:16px;margin:14px 0 0\">解答履歴<\/h2>`;\n  if (!hist.length) return h + `<div class=\"muted\">記録はまだありません<\/div><\/div>`;\n  h += `<table class=\"hist\"><tr><th>日付<\/th><th>選択した解答${S.session && S.session.shuffle ? \"<br><span class='muted'>（元の番号）<\/span>\" : \"\"}<\/th><th>正誤<\/th><th>時間<\/th><th>自己評価<\/th><\/tr>`;\n  hist.slice().reverse().slice(0, 30).forEach(r => {\n    h += `<tr><td>${fmtDate(r.t)}<\/td><td>${r.a.length ? r.a.join(\"、\") : \"未解答\"}${r.ch ? `<br><span class=\"muted\">${r.first != null ? `最初は${r.first}、` : \"\"}選び直し${r.ch}回<\/span>` : \"\"}<\/td>\n      <td class=\"${r.ok ? \"ok-t\" : \"ng-t\"}\">${r.ok ? \"正解\" : \"不正解\"}<\/td><td>${r.sec != null ? fmtSec(r.sec) : \"－\"}<\/td><td>${esc(r.ev || \"\")}<\/td><\/tr>`;\n  });\n  return h + `<\/table><\/div>`;\n}\nfunction chipsHtml(s) {\n  return s.ids.map((id, i) => {\n    const q = BYID[id]; if (!q) return \"\";\n    const r = s.revealed[id] ? (isCorrect(q, s.answers[id] || []) ? \"◯\" : \"✕\") : \"－\";\n    const cls = r === \"◯\" ? \"ok\" : r === \"✕\" ? \"ng\" : \"\";\n    return `<button class=\"${cls} ${i === s.idx ? \"on\" : \"\"}\" data-jump=\"${i}\">問${i + 1} ${r}<\/button>`;\n  }).join(\"\");\n}\nfunction doAnswer() {\n  const s = S.session; const q = BYID[s.ids[s.idx]];\n  const mine = selected.map(d => toOrig(s, q, d)).sort((a, b) => a - b);\n  if (q.answer.length > 1 && !q.anyOf && mine.length && mine.length !== q.answer.length) { toast(`${q.answer.length}つ選んでください`); return; }\n  s.answers[q.id] = mine; s.revealed[q.id] = true;\n  const ok = isCorrect(q, mine);\n  trackPause();\n  const tr = TRACK[q.id] || { ms: 0, picks: [] }; delete TRACK[q.id];\n  const single = !(q.answer.length > 1 && !q.anyOf);\n  const rec = { t: Date.now(), a: mine, ok, sec: Math.round(Math.min(tr.ms, 600000) / 100) / 10, ch: Math.max(0, tr.picks.length - 1) };\n  if (single && tr.picks.length) { rec.first = tr.picks[0]; rec.firstOk = isCorrect(q, [tr.picks[0]]); }\n  const p = S.progress[q.id] || { attempts: 0, correct: 0 };\n  p.attempts++; if (ok) p.correct++; p.last = ok; p.at = rec.t;\n  (p.hist = p.hist || []).push(rec);\n  S.progress[q.id] = p;\n  enqueue(q.id, rec);\n  selected = []; save(); renderQuiz(); syncSoon();\n}\nfunction goto(i) { const s = S.session; s.idx = Math.max(0, Math.min(s.ids.length - 1, i)); selected = []; save(); renderQuiz(); }\n\n// ---------- 結果 ----------\nfunction renderResult() {\n  const s = S.session; s.finished = true; save();\n  const ids = s.ids.filter(id => BYID[id]);\n  const answered = ids.filter(id => \n  if (q.bookExpl) h += `<h2 style=\"color:var(--primary)\">本の解説${q.bookRef ? `<span class=\"muted\" style=\"font-weight:normal\">（${esc(q.bookRef)}）<\/span>` : \"\"}<\/h2>\n    <div class=\"expl\" style=\"border-left:3px solid var(--line, #ccc);padding-left:10px\">${esc(q.bookExpl)}<\/div>`;\n  else if (q.bookRef) h += `<div class=\"muted\" style=\"margin-top:8px\">${q.explanation ? \"\" : \"解説は準備中です。\"}『言語聴覚士国家試験データベース』の解説は${esc(q.bookRef)}を見てください。<\/div>`;\n  return h;\n}\nfunction hay(q) {\n  return q._hay || (q._hay = fold([q.field, q.category, q.topic, q.source, srcKey(q), q.stem, (q.statements || []).join(\" \"),\n    (q.choices || []).join(\" \"), (q.keywords || []).join(\" \"), q.explanation, q.bookExpl, q.note].join(\" \")));\n}\nfunction hl(text, terms) {\n  let s = esc(text);\n  terms.forEach(t => { if (!t) return; const e = esc(t).replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"); s = s.replace(new RegExp(e, \"gi\"), m => `<mark>${m}<\/mark>`); });\n  return s;\n}\n// 出典の指定（「24回午後3」「24 午後 3」「第24回 午後 問題3」「24午後」など）は、スペースの有無に関係なくその問題だけに絞る\nconst SRC_RE = /第?\\s*(\\d{1,2})\\s*回?\\s*(午前|午後)\\s*(?:問題|問)?\\s*(\\d{1,3})?(?!\\d)/;\nfunction srcOf(q) { const m = String(q.source || \"\").match(/第(\\d+)回.*?(午前|午後)\\s*問題\\s*(\\d+)/); return m ? [+m[1], m[2], +m[3]] : null; }\nfunction runSearch() {\n  let qtext = fold(searchQ), src = null;\n  const sm = qtext.match(SRC_RE);\n  if (sm) { src = [+sm[1], sm[2], sm[3] ? +sm[3] : null]; qtext = qtext.replace(sm[0], \" \"); }\n  const terms = qtext.split(/\\s+/).filter(Boolean);\n  const srcHit = q => { if (!src) return true; const s = srcOf(q); return !!s && s[0] === src[0] && s[1] === src[1] && (src[2] == null || s[2] === src[2]); };\n  const memoHit = id => S.memos[id] && terms.every(t => fold(S.memos[id]).includes(t));\n  searchHits = terms.length || src ? BANK.filter(q => srcHit(q) && (terms.every(t => hay(q).includes(t)) || (terms.length && memoHit(q.id)))) : [];\n  if (src) searchHits.sort((a, b) => srcOf(a)[2] - srcOf(b)[2]);\n  const raw = searchQ.normalize(\"NFKC\").replace(src ? SRC_RE : /$^/, \" \").trim().split(/\\s+/).filter(Boolean);\n  let h = \"\";\n  if (!terms.length && !src) h = `<p class=\"muted\">問題文・選択肢・解説・キーワード・出典（例：25午前1、24回 午後 3、24午後）・メモから探せます。スペースで区切ると全部を含む問題に絞り込みます。出典はスペースがあってもなくても、その問題だけを出します。<\/p>`;\n  else {\n    h = `<div class=\"row\"><strong>${searchHits.length}件<\/strong><span class=\"spacer\"><\/span>${searchHits.length ? `<button class=\"primary small\" data-act=\"search-start\">この${searchHits.length}問で演習<\/button>` : \"\"}<\/div><div class=\"card\">`;\n    if (!searchHits.length) h += `<span class=\"muted\">見つかりませんでした。<\/span>`;\n    searchHits.slice(0, 100).forEach(q => {\n      const p = S.progress[q.id];\n      const exText = [q.explanation, q.bookExpl].find(t => t && terms.some(w => fold(t).includes(w)));\n      const ex = exText ? `<div class=\"muted\" style=\"margin-top:4px\">解説：${hl(exText.length > 120 ? exText.slice(0, 120) + \"…\" : exText, raw)}<\/div>` : \"\";\n      h += `<div class=\"list-item\"><div class=\"meta\">${esc(q.category)}　${hl(q.source, raw)}${p ? `　正答率 ${pct(p.correct, p.attempts)}%` : \"\"}<\/div>\n        <div>${hl(q.stem, raw)}<\/div>${ex}\n        <div class=\"row\" style=\"margin-top:6px\"><button class=\"small\" data-one=\"${esc(q.id)}\">この1問を解く<\/button><\/div><\/div>`;\n    });\n    if (searchHits.length > 100) h += `<div class=\"muted list-item\">ほか${searchHits.length - 100}件（演習ボタンでは全件を出題します）<\/div>`;\n    h += `<\/div>`;\n  }\n  $(\"#searchResults\").innerHTML = h;\n}\nfunction renderSearch() {\n  setHeader(\"問題検索\");\n  $(\"#view\").innerHTML = `<div class=\"row\"><h2 style=\"margin:0\">問題検索<\/h2><span class=\"spacer\"><\/span><button class=\"small\" data-act=\"home\">ホームへ<\/button><\/div>\n    <input id=\"searchBox\" class=\"sinput\" type=\"search\" placeholder=\"例：失語　ブローカ\" value=\"${esc(searchQ)}\" style=\"margin-top:10px\">\n    <div id=\"searchResults\" style=\"margin-top:10px\"><\/div>`;\n  const box = $(\"#searchBox\"); let t;\n  box.addEventListener(\"input\", () => { clearTimeout(t); t = setTimeout(() => { searchQ = box.value; runSearch(); }, 200); });\n  runSearch(); box.focus(); window.scrollTo(0, 0);\n}\nfunction renderList(kind) {\n  listKind = kind;\n  const titles = { retry: \"リトライ問題\", excluded: \"演習除外問題\", memo: \"メモ一覧\" };\n  const ids = kind === \"memo\" ? Object.keys(S.memos).filter(id => S.memos[id] && BYID[id]) : S[kind].filter(id => BYID[id]);\n  setHeader(titles[kind]);\n  let h = `<div class=\"row\"><h2 style=\"margin:0\">${titles[kind]}（${ids.length}）<\/h2><span class=\"spacer\"><\/span>\n    ${kind !== \"excluded\" && ids.length ? `<button class=\"primary small\" data-act=\"list-start\">この問題で演習<\/button>` : \"\"}<\/div><div class=\"card\">`;\n  if (!ids.length) h += `<span class=\"muted\">まだありません。<\/span>`;\n  ids.forEach(id => {\n    const q = BYID[id]; const p = S.progress[id];\n    h += `<div class=\"list-item\"><div class=\"meta\">${esc(q.category)}　${esc(q.source)}${p ? `　正答率 ${pct(p.correct, p.attempts)}%` : \"\"}<\/div>\n      <div>${esc(q.stem)}<\/div>\n      ${kind === \"memo\" ? `<div class=\"muted expl\" style=\"margin-top:4px\">📝 ${esc(S.memos[id])}<\/div>` : \"\"}\n      <div class=\"row\" style=\"margin-top:6px\"><button class=\"small\" data-one=\"${esc(id)}\">この1問を解く<\/button>\n      ${kind !== \"memo\" ? `<button class=\"small\" data-remove=\"${esc(id)}\">一覧から外す<\/button>` : \"\"}<\/div><\/div>`;\n  });\n  h += `<\/div><button data-act=\"home\">ホームへ<\/button>`;\n  $(\"#view\").innerHTML = h;\n  window.scrollTo(0, 0);\n}\n\n// ---------- データ管理 ----------\nlet importMode = \"add\";\nfunction renderData() {\n  setHeader(\"データ管理\");\n  const sample = { id: \"my-001\", category: \"聴覚障害\", source: \"自作\", stem: \"問題文\", statements: [\"aの文\", \"bの文\", \"cの文\", \"dの文\", \"eの文\"], choices: [\"a、b\", \"a、e\", \"b、c\", \"c、d\", \"d、e\"], answer: 2, explanation: \"解説\" };\n  $(\"#view\").innerHTML = `\n    ${S.account ? `<div class=\"card\">< on><button data-act=\"reset-all\">すべて初期化<\/button><\/div><\/div>\n    <button data-act=\"home\">ホームへ<\/button>`;\n  window.scrollTo(0, 0);\n}\nfunction download(name, obj) {\n  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: \"application/json\" });\n  const a = document.createElement(\"a\"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();\n  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n}\nfunction pickFile(cb) {\n  const fi = $(\"#fileInput\"); fi.value = \"\";\n  fi.onchange = () => { const f = fi.files[0]; if (!f) return; const r = new FileReader();\n    r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { alert(\"JSON として読み込めませんでした：\\n\" + e.message); } };\n    r.readAsText(f); };\n  fi.click();\n}\nfunction validQuestions(arr) {\n  if (!Array.isArray(arr)) arr = arr && Array.isArray(arr.questions) ? arr.questions : null;\n  if (!arr) throw new Error(\"配列ではありません\");\n  arr.forEach((q, i) => { if (!q.stem || !Array.isArray(q.choices) || q.answer == null) throw new Error(`${i + 1}件目：stem / choices / answer が必要です`); });\n  return arr;\n}\n\n// ---------- ログイン・同期 ----------\n// 解答は端末に保存し（オフラインでも可）、ネットにつながった時に集計サーバーへまとめて送る。\n// サーバーにはランダムな ID だけを送り、名前は送らない。\nconst normPass = s => String(s || \"\").normalize(\"NFKC\").trim();\nfunction passHash(s) {  // cyrb53（tools/set_class.py と同じ計算）\n  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;\n  for (const ch of normPass(s)) { const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }\n  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);\n  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);\n  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);\n}\nconst normId = s => String(s || \"\").normalize(\"NFKC\").toUpperCase().replace(/\\s/g, \"\");\n// 名簿が変わって今の学籍番号が入っていなければ、ログインし直してもらう\nconst needLogin = () => (!!CLASS.passHash || !!CLASS.url) && (!S.account || S.account.relogin || (CLASS.students.length > 0 && !CLASS.students.includes(S.account.id)));\n// ログイン：集計サーバーがあるときは「学籍番号＋自分のパスワード」。合言葉ははじめてパスワードを登録するときだけ聞く\n// （管理者の学籍番号は管理者の合言葉）。サーバーがないときは合言葉だけで端末の中で使う\nlet regMode = false;  // サーバーがあるとき：false＝「ログイン」タブ、true＝「はじめての登録」タブ\nfunction renderLogin(keep) {\n  setHeader(\"ログイン\");\n  const old = keep ? { id: $(\"#lgId\") && $(\"#lgId\").value } : {};\n  const pre = old.id != null ? esc(old.id) : S.account && (!CLASS.students.length || CLASS.students.includes(S.account.id)) ? esc(S.account.id) : \"\";\n  const server = !!CLASS.url, reg = server && regMode;\n  const pwBox = (id, ph, ac) => `<div style=\"position:relative;margin-top:8px\"><input id=\"${id}\" class=\"sinput\" type=\"password\" placeholder=\"${ph}\" autocomplete=\"${ac}\" style=\"padding-right:64px\">\n      <button type=\"button\" class=\"small\" data-eye=\"${id}\" style=\"position:absolute;right:6px;top:50%;transform:translateY(-50%)\">表示<\/button><\/div>`;\n  const passBox = `<input id=\"lgPass\" class=\"sinput\" type=\"text\" style=\"margin-top:8px\" placeholder=\"クラスの合言葉\" autocomplete=\"off\" autocorrect=\"off\" spellcheck=\"false\">`;\n  $(\"#view\").innerHTML = `<div class=\"card\">\n    ${server ? `<div class=\"seg\" style=\"margin-bottom:12px\"><button class=\"${reg ? \"\" : \"on\"}\" data-lgtab=\"0\" style=\"flex:1\">ログイン<\/button><button class=\"${reg ? \"on\" : \"\"}\" data-lgtab=\"1\" style=\"flex:1\">はじめての登録<\/button><\/div>` : \"<strong>ログイン<\/strong>\"}\n    <p class=\"muted\" style=\"margin-top:0\">${!server ? \"学籍番号とクラスの合言葉を入れてください。\" : reg ? `はじめて使う人は、ここで自分のパスワードを決めます（1回だけ）。確認のため、クラスの合言葉${CLASS.adminId ? \"（管理者本人は管理者の合言葉）\" : \"\"}も入れてください。登録したあと、管理者が承認すると使えるようになります。` : \"登録した学籍番号とパスワードを入れてください。まだ登録していない人は「はじめての登録」へ。\"}一度ログインすればオフラインでも使えます。<\/p>\n    <input id=\"lgId\" class=\"sinput\" placeholder=\"学籍番号（例：2024R001）\" autocomplete=\"username\" autocapitalize=\"characters\" value=\"${pre}\">\n    ${!server ? passBox : reg ? passBox + pwBox(\"lgPw\", \"パスワード（6文字以上）\", \"new-password\") + pwBox(\"lgPw2\", \"パスワードをもう一度\", \"new-password\")\n      : pwBox(\"lgPw\", \"パスワード\", \"current-password\")}\n    ${reg ? `<div class=\"muted\" style=\"font-size:13px;margin-top:4px\">決めたパスワードはメモしておいてください。忘れたら管理者に「リセット」を頼むと、もう一度登録できます。<\/div>` : \"\"}\n    <button class=\"primary\" style=\"width:100%;padding:14px;margin-top:14px\" data-act=\"login\">${reg ? \"登録してログイン\" : \"ログイン\"}<\/button>\n    ${server && !reg ? `<div class=\"muted\" style=\"font-size:13px;margin-top:6px\">パスワードを忘れたら管理者に「リセット」を頼んでください。ログインにはインターネット接続が必要です。<\/div>` : \"\"}\n    <p class=\"muted\" style=\"margin-bottom:0\">解答の記録は学籍番号ごとに集計サーバーへ送られ、管理者が見られます。ほかのクラスメイトに見えるのは、問題ごとの「みんなの正答率」（人数と割合）だけです。別のスマホやPCでも同じ学籍番号でログインすれば記録を引き継げます。<\/p><\/div>`;\n  // タブの切り替え（学籍番号は残す）\n  document.querySelectorAll(\"[data-lgtab]\").forEach(t => t.addEventListener(\"click\", e => { e.stopPropagation(); regMode = t.dataset.lgtab === \"1\"; renderLogin(true); }));\n  // パスワードの表示／非表示\n  document.querySelectorAll(\"[data-eye]\").forEach(eye => eye.addEventListener(\"click\", e => { e.stopPropagation(); const f = $(\"#\" + eye.dataset.eye), show = f.type === \"password\"; f.type = show ? \"text\" : \"password\"; eye.textContent = show ? \"隠す\" : \"表示\"; f.focus(); }));\n  // Enter でログイン（変換確定の Enter は除く）\n  [\"#lgId\", \"#lgPass\", \"#lgPw\", \"#lgPw2\"].filter(s => $(s)).forEach(s => $(s).addEventListener(\"keydown\", e => { if (e.key === \"Enter\" && !e.isComposing && e.keyCode !== 229) doLogin(); }));\n  window.scrollTo(0, 0);\n}\nlet loggingIn = false;\nasync function doLogin() {\n  if (loggingIn) return;\n  const id = normId($(\"#lgId\").value), pass = $(\"#lgPass\") ? normPass($(\"#lgPass\").value) : \"\", pw = $(\"#lgPw\") ? normPass($(\"#lgPw\").value) : \"\";\n  if (!id) return toast(\"学籍番号を入れてください\");\n  if (CLASS.students.length && !CLASS.students.includes(id)) return toast(\"この学籍番号ではログインできません\");\n  const isAdminId = !!CLASS.adminId && id === CLASS.adminId;\n  let admin = false;\n  if (CLASS.url) {\n    if (pw.length < (regMode ? 6 : 4)) return toast(`パスワードは${regMode ? 6 : 4}文字以上にしてください`);\n    if (!navigator.onLine) return toast(\"ログインにはインターネット接続が必要です\");\n    if (regMode && !pass) return toast(isAdminId ? \"管理者の合言葉を入れてください\" : \"クラスの合言葉を入れてください\");\n    if (regMode && normPass($(\"#lgPw2\").value) !== pw) return toast(\"2つのパスワードが一致しません\");\n    loggingIn = true; toast(\"確認しています…\");\n    try {\n      let res;\n      if (regMode) {\n        res = await post({ uid: id, pass, pw, register: true });\n        // 登録済みの人は、パスワードが合えばそのままログイン、違えば「登録済み」と伝える\n        if (res && res.error === \"pw\") return toast(\"この学籍番号はもう登録されています。「ログイン」タブからログインしてください\", 5000);\n        if (res && res.error === \"pending\") res = { ok: true, registered: true, pending: true };  // 登録はできた（管理者の承認待ち）\n        if (res && res.ok && res.registered) alert(\"パスワードを登録しました。忘れないようにメモしておいてください。次からは「ログイン」タブで学籍番号とパスワードだけでログインできます。\"\n          + (res.pending ? \"\\n\\n管理者が承認すると、問題を受け取れるようになります（承認されたら自動で始まります）。\" : \"\"));\n      } else {\n        res = await post({ uid: id, pw });\n        if (res && res.error === \"pending\") res = { ok: true, pending: true };  // パスワードは合っている（承認待ち）\n        if (res && res.error === \"pwnew\") { regMode = true; renderLogin(true); toast(\"まだ登録されていません。はじめにパスワードを登録してください\", 5000); return; }\n      }\n      const LERR = { pw: \"パスワードが違います\", pwshort: \"パスワードは6文字以上にしてください\", pass: \"合言葉が違います\", admin: \"管理者の合言葉が違います\" };\n      if (!res || !res.ok) return toast((res && (LERR[res.error] || SERR[res.error])) || \"サーバーエラー\", 4000);\n    } catch (e) { return toast(\"つながりませんでした。ネット接続を確かめてください\"); }\n    finally { loggingIn = false; }\n    admin = isAdminId;\n  } else {\n    admin = !!CLASS.adminHash && passHash(pass) === CLASS.adminHash && (!CLASS.adminId || isAdminId);\n    if (CLASS.passHash && !admin && passHash(pass) !== CLASS.passHash) return toast(\"合言葉が違います\");\n  }\n  regMode = false;\n  const same = S.account && S.account.id === id;  // パスワードのリセット後に同じ人がログインし直す場合\n  S.account = { id, pw, cursor: same ? S.account.cursor || 0 : 0, at: Date.now(), admin };\n  if (!same) S.ud = blank().ud;  // この端末のリトライ・メモなどは、サーバーの分と合わせる（はじめの1回は古い扱いで送る）\n  // ログイン前にこの端末で解いた記録もまとめて送る\n  S.outbox = [];\n  Object.entries(S.progress).forEach(([q, p]) => (p.hist || []).forEach(r => enqueue(q, r)));\n  save();\n  renderHome(); sync({ stats: true }).then(() => checkUpdate(false, true));\n}\nconst ridOf = (q, r) => r.t.toString(36) + q;\nfunction enqueue(q, r) { if (S.account) S.outbox.push({ q, t: r.t, ok: !!r.ok, sec: r.sec ?? null, a: r.a || [], rid: ridOf(q, r) }); }\n\n// みんなの正答率（前回取得した分を端末に保存。オフラインでも表示できる）\nconst SKEY = \"stDrill_shared\";\nlet SHARED = {}; try { SHARED = JSON.parse(localStorage.getItem(SKEY) || \"{}\"); } catch (e) {}\nfunction sharedHtml(id) {\n  if (!S.account || !CLASS.url) return \"\";\n  const s = SHARED.stats && SHARED.stats[id];\n  if (!s || !s[0]) return `<div class=\"muted\">みんなの正答率：${SHARED.t ? \"まだ解いた人がいません\" : \"ネットにつながると表示されます\"}<\/div>`;\n  return `<div class=\"muted\">みんなの正答率：<strong style=\"color:var(--text)\">${pct(s[1], s[0])}%<\/strong>（${s[2]}人・${s[0]}回の解答${SHARED.t ? `、${fmtDate(SHARED.t)}時点` : \"\"}）<\/div>`;\n}\nlet syncState = \"\", syncing = false, syncTimer = null;\nfunction syncText() {\n  if (!S.account) return \"\";\n  if (!CLASS.url) return `${S.account.id}（集計サーバー未設定：記録はこの端末だけ）`;\n  const n = S.outbox.length, last = S.account.synced;\n  const tm = last ? `${fmtDate(last).slice(5)} ${String(new Date(last).getHours()).padStart(2, \"0\")}:${String(new Date(last).getMinutes()).padStart(2, \"0\")}` : \"まだ\";\n  return `${S.account.id}・${syncState || (n ? `未送信 ${n}件` : \"送信済み\")}・最終同期 ${tm}`;\n}\nfunction showSync() { const el = $(\"#syncInfo\"); if (el) el.textContent = syncText(); }\nfunction syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), 3000); }\nasync function post(body, ms = 30000) {\n  const ac = new AbortController(), to = setTimeout(() => ac.abort(), ms);\n  try {\n    const r = await fetch(CLASS.url, { method: \"POST\", body: JSON.stringify(body), headers: { \"Content-Type\": \"text/plain;charset=utf-8\" }, signal: ac.signal });\n    return await r.json();\n  } finally { clearTimeout(to); }\n}\n// 別の端末で解いた自分の記録を取り込む\nfunction mergeRemote(rows) {\n  const touched = new Set();\n  rows.forEach(([t, q, ok, sec, a, rid]) => {\n    rid = String(rid); q = String(q);\n    if (rid.endsWith(q)) t = parseInt(rid.slice(0, -q.length), 36) || t;  // 正確な時刻は記録番号から（シートの日時は秒単位に丸まるため）\n    const p = S.progress[q] || { attempts: 0, correct: 0 };\n    p.hist = p.hist || [];\n    if (p.hist.some(r => ridOf(q, r) === rid)) return;\n    p.hist.push({ t, a: a || [], ok: !!ok, sec: sec ?? null });\n    p.attempts++; if (ok) p.correct++;\n    S.progress[q] = p; touched.add(q);\n  });\n  touched.forEach(q => { const p = S.progress[q]; p.hist.sort((x, y) => x.t - y.t); const l = p.hist[p.hist.length - 1]; if (!p.at || l.t >= p.at) { p.last = l.ok; p.at = l.t; } });\n  return touched.size;\n}\nconst auth = () => ({ uid: S.account.id, pw: S.account.pw || \"\" });\nconst SERR = { pass: \"合言葉がサーバーと違います\", uid: \"この学籍番号はサーバーの名簿にありません\", pw: \"パスワードが違います（リセットされた可能性があります）\", pwnew: \"パスワードが未登録です\", admin: \"サーバーの管理者の合言葉と違います\", locked: \"まちがいが続いたので、この学籍番号は15分ロックされています。しばらくしてから試してください\", pending: \"管理者の承認待ちです。承認されると問題を受け取れます\", rptmax: \"報告は1日20件までです。また明日お願いします\", busy: \"登録のまちがいが多いため、登録を1時間止めています。しばらくしてから試してください\" };\nasync function sync(opt = {}) {\n  const ac = S.account;\n  if (!ac || !CLASS.url || syncing) return;\n  if (!navigator.onLine) { if (opt.manual) toast(\"オフラインです。つながったら自動で送ります\"); return; }\n  syncing = true; syncState = \"同期中…\"; showSync();\n  let got = 0, udGot = 0, err = \"\";\n  try {\n    for (let i = 0; i < 50; i++) {\n      const batch = S.outbox.slice(0, 500), more = S.outbox.length > 500;\n      const wantStats = !more && (opt.stats || Date.now() - (SHARED.t || 0) > 30 * 60 * 1000);\n      if (!more) udDiff(Date.now());\n      const udSent = more ? null : udPending();\n      const res = await post({ ...auth(), push: batch, mine: more ? null : ac.cursor || 0, stats: wantStats, ...(udSent ? { ud: { rev: S.ud.rev, items: udSent } } : {}) });\n      if (!res || !res.ok) {\n        err = (res && SERR[res.error]) || \"サーバーエラー\";\n        if (res && (res.error === \"pw\" || res.error === \"pwnew\")) { ac.relogin = true; err += \"。ログインし直してください\"; }  // 次にホームを開いたときログイン画面へ\n        break;\n      }\n      S.outbox.splice(0, batch.length);\n      if (res.mine) { got += mergeRemote(res.mine); ac.cursor = res.cursor; }\n      if (udSent && res.udRev != null) udGot += udDone(udSent, res);  // 古いサーバー（udRev を返さない）なら送り直す\n      if (got || udGot) udFillEv();\n      if (res.stats) { SHARED = { t: Date.now(), stats: res.stats }; try { localStorage.setItem(SKEY, JSON.stringify(SHARED)); } catch (e) {} }\n      if (!more) break;\n    }\n    if (!err) ac.synced = Date.now();\n  } catch (e) { err = \"つながりませんでした\" + (e && e.name === \"AbortError\" ? \"：時間切れ\" : e && e.message ? \"：\" + e.message : \"\"); console.error(\"同期エラー\", e); }\n  syncing = false; syncState = err ? `同期できませんでした（${err}）` : \"\"; save(); showSync();\n  const gotMsg = [got ? `解答の記録${got}問分` : \"\", udGot ? `リトライ・除外・メモ・自己評価${udGot}件` : \"\"].filter(Boolean).join(\"と\");\n  if (opt.manual) toast(err ? syncState : gotMsg ? `別の端末の${gotMsg}を取り込みました` : \"同期しました\");\n  else if (gotMsg && !S.session) toast(`別の端末の${gotMsg}を取り込みました`);\n  if (udGot && !S.session && $(\"#syncInfo\")) renderHome(true);  // ホームのリトライ・メモの件数を新しくする\n}\n\n// ---------- リトライ・除外・メモ・自己評価の同期 ----------\n// サーバーに学籍番号ごとに { キー: [変更した時刻(ms), 値] } で預ける。キーは r|問題ID（リトライ）、x|問題ID（除外）、\n// m|問題ID（メモ）、e|記録番号（その解答の自己評価）。消したものも値 0 / \"\" で残し、別の端末にも消したことを伝える。\n// S.ud.m はサーバーに預けた（つもりの）内容の写し。保存のたびに今の状態と比べ、違う所を「変更」として dirty に入れて送る。\n// 端末どうしで食い違ったら時刻の新しい方を残す（同じ時刻なら値の大きい方。サーバーも同じ決まり）\nconst udNewer = (a, b) => a[0] > b[0] || (a[0] === b[0] && JSON.stringify(a[1]) > JSON.stringify(b[1]));\nconst udZero = k => k[0] === \"r\" || k[0] === \"x\" ? 0 : \"\";\n// quiet：変更として送らず、写しだけ今の状態に合わせる（「すべて初期化」はこの端末だけを消すため）\nfunction udDiff(t, quiet) {\n  const u = S.ud, cur = {}, rids = new Set(); let n = 0;\n  S.retry.forEach(id => { cur[\"r|\" + id] = 1; });\n  S.excluded.forEach(id => { cur[\"x|\" + id] = 1; });\n  Object.keys(S.memos).forEach(id => { if (S.memos[id]) cur[\"m|\" + id] = S.memos[id]; });\n  Object.entries(S.progress).forEach(([q, p]) => (p.hist || []).forEach(r => { const rid = ridOf(q, r); rids.add(rid); if (r.ev) cur[\"e|\" + rid] = r.ev; }));\n  // この機能が入る前からある分は、はじめの1回だけ「とても古い変更」として送る（ほかの端末で消した分を復活させないため）\n  if (!u.seeded) { t = 1; u.seeded = true; }\n  new Set([...Object.keys(cur), ...Object.keys(u.m)]).forEach(k => {\n    if (k[0] === \"e\" && !rids.has(k.slice(2))) return;  // その解答の記録がまだこの端末にない\n    const v = k in cur ? cur[k] : udZero(k), old = u.m[k];\n    if (old ? old[1] === v : v === udZero(k)) return;\n    u.m[k] = [t, v];\n    if (quiet) delete u.dirty[k]; else { u.dirty[k] = 1; n++; }\n  });\n  return n;\n}\nfunction udPending() {\n  const u = S.ud, items = {};\n  Object.keys(u.dirty).forEach(k => { if (u.m[k]) items[k] = u.m[k]; else delete u.dirty[k]; });\n  return items;\n}\n// サーバーの返事を受けて：送れた分を dirty から外し、別の端末の変更（res.ud）を取り込む。取り込んだ件数を返す\nfunction udDone(sent, res) {\n  const u = S.ud; let n = 0;\n  Object.keys(sent).forEach(k => { if (u.m[k] === sent[k]) delete u.dirty[k]; });  // 送っている間に変わった分は次に送る\n  if (res.ud && typeof res.ud === \"object\") Object.entries(res.ud).forEach(([k, e]) => {\n    if (!Array.isArray(e) || !/^[rxme]\\|/.test(k)) return;\n    const l = u.m[k];\n    if (l && l[0] === 1 && e[0] === 1 && k[0] === \"m\" && l[1] && e[1] && l[1] !== e[1]) {\n      // この機能が入る前に2つの端末で同じ問題にメモを書いていたら、消さずにつなげる\n      e = [2, l[1].includes(e[1]) ? l[1] : e[1].includes(l[1]) ? e[1] : l[1] + \"\\n\" + e[1]]; u.dirty[k] = 1;\n    } else if (l && !udNewer(e, l)) return;\n    else delete u.dirty[k];\n    u.m[k] = e; n++;\n    const id = k.slice(2), v = e[1];\n    if (k[0] === \"r\" || k[0] === \"x\") { const a = k[0] === \"r\" ? S.retry : S.excluded, i = a.indexOf(id); if (v && i < 0) a.push(id); if (!v && i >= 0) a.splice(i, 1); }\n    else if (k[0] === \"m\") { if (v) S.memos[id] = v; else delete S.memos[id]; }\n  });\n  u.rev = res.udRev;\n  return n;\n}\n// 写しにある自己評価を、その解答の記録に書き込む（別の端末の解答を取り込んだ後にも呼ぶ）\nfunction udFillEv() {\n  const ev = {}; Object.keys(S.ud.m).forEach(k => { if (k[0] === \"e\") ev[k.slice(2)] = S.ud.m[k][1]; });\n  Object.entries(S.progress).forEach(([q, p]) => (p.hist || []).forEach(r => { const v = ev[ridOf(q, r)]; if (v !== undefined && (r.ev || \"\") !== v) r.ev = v; }));\n}\nudReady = true;\n\n// ---------- 自動更新（共有版だけ） ----------\n// 包んだファイル（tools/wrap.py）で起動したときだけ __ST_BOOT__ がある。新しい版はサーバー経由で Google ドライブから取り、\n// IndexedDB に保存しておく。次に開いたとき（または「今すぐ切り替える」で）新しい版で起動する\nconst BOOT = window.__ST_BOOT__ || null;\nconst UKEY = \"stDrill_update\";\nconst autoUpdate = () => !!(BOOT && BOOT.channel === \"share\" && CLASS.url);\nconst fmtVer = v => v ? v.slice(0, 16).replace(/-/g, \"/\") : \"－\";\nfunction idbPut(rec) {\n  return new Promise((ok, ng) => {\n    const rq = indexedDB.open(\"stDrillApp\", 1);\n    rq.onupgradeneeded = () => rq.result.createObjectStore(\"app\");\n    rq.onerror = () => ng(rq.error);\n    rq.onsuccess = () => { const tx = rq.result.transaction(\"app\", \"readwrite\"); tx.objectStore(\"app\").put(rec, \"latest\"); tx.oncomplete = () => ok(); tx.onerror = () => ng(tx.error); };\n  });\n}\nfunction showUpdateBar(ver) {\n  if ($(\"#updBar\")) return;\n  const d = document.createElement(\"div\"); d.id = \"updBar\"; d.className = \"card\";\n  d.style.cssText = \"position:fixed;left:12px;right:12px;top:8px;z-index:20;max-width:700px;margin:0 auto;border-color:var(--primary);box-shadow:0 4px 16px rgba(0,0,0,.2)\";\n  d.innerHTML = `<div class=\"row\"><span>新しい版（${esc(fmtVer(ver))}）を取り込みました。<\/span><span class=\"spacer\"><\/span>\n    <button class=\"primary small\" data-act=\"apply-update\">今すぐ切り替える<\/button><button class=\"small\" data-act=\"later-update\">あとで<\/button><\/div>`;\n  document.body.appendChild(d);\n}\nlet updating = false;\n// 配るファイルには問題が入っていない（tools/wrap.py の配布版）。ログインしたらサーバーから問題入りの版を取り込んで切り替える\nconst firstLoad = () => autoUpdate() && !BANK.length;\nlet firstErr = \"\";\nasync function checkUpdate(manual, force) {  // force：ログインした直後は3時間を待たずに確かめる\n  if (!autoUpdate() || !S.account || updating) { if (manual) toast(\"このファイルは自動更新に対応していません\"); return; }\n  const first = firstLoad();\n  if (!navigator.onLine) { if (manual) toast(\"オフラインです\"); if (first) { firstErr = \"オフラインです。ネットにつながると取り込みます\"; renderHomeIfShown(); } return; }\n  let u = {}; try { u = JSON.parse(localStorage.getItem(UKEY) || \"{}\"); } catch (e) {}\n  if (!manual && !first && !force && Date.now() - (u.t || 0) < 3 * 3600 * 1000) return;  // 確認は3時間に1回\n  if (first) { firstErr = \"\"; renderHomeIfShown(); }\n  updating = true; if (manual) toast(\"確認しています…\");\n  try {\n    const res = await post({ ...auth(), appver: true });\n    if (res && res.error === \"drive\") throw new Error(\"サーバーがドライブを読めませんでした（\" + (res.detail || \"\") + \"）\");\n    if (!res || !res.ok) throw new Error((res && SERR[res.error]) || \"サーバーエラー\");\n    u.t = Date.now(); try { localStorage.setItem(UKEY, JSON.stringify(u)); } catch (e) {}\n    const latest = res.appver;\n    if (!latest || latest <= BOOT.running) { if (first) throw new Error(\"サーバーに問題データがまだ置かれていません（管理者に連絡してください）\"); if (manual) toast(\"最新の版です\"); return; }\n    if (first || u.saved !== latest) {  // 初回は端末に無いので必ず受け取る\n      const r2 = await post({ ...auth(), app: true }, 180000);\n      const html = r2 && r2.ok && r2.app || \"\";\n      const m = html.match(/<meta name=\"st-drill-version\" content=\"([^\"]+)\" data-channel=\"([^\"]+)\">/);\n      const j = html.match(/<script type=\"application\\/json\" id=\"st-app\">([\\s\\S]*?)<\\/script>/);\n      if (!m || !j || m[2] !== \"share\" || m[1] !== latest) throw new Error(\"更新ファイルの形が違います\");\n      await idbPut({ ver: m[1], channel: m[2], html: JSON.parse(j[1]), at: Date.now() });\n      u.saved = latest; try { localStorage.setItem(UKEY, JSON.stringify(u)); } catch (e) {}\n    }\n    if (first) { save(); return location.reload(); }  // 問題入りの版で起動し直す\n    showUpdateBar(latest);\n  } catch (e) {\n    const msg = e.name === \"AbortError\" ? \"つながりませんでした（時間切れ）\" : e instanceof TypeError ? \"つながりませんでした\" : e.message;\n    if (manual) toast(\"更新を確認できませんでした（\" + msg + \"）\");\n    if (first) { firstErr = msg; renderHomeIfShown(); }\n  }\n  finally { updating = false; }\n}\n\nfunction renderHomeIfShown() { if ($(\"#homeView\")) renderHome(true); }\n\n// ---------- 管理者画面 ----------\n// 集計サーバーから全員分の集計を取ってくる（IDごとの成績を含むので管理者の合言葉が必要）。前回の結果は端末に保存\nconst AKEY = \"stDrill_admin\";\nlet ADMIN = {}; try { ADMIN = JSON.parse(localStorage.getItem(AKEY) || \"{}\"); } catch (e) {}\nlet adminLoading = false;\nasync function fetchAdmin(manual) {\n  const ac = S.account;\n  if (!ac || !ac.admin || !CLASS.url || adminLoading) return;\n  if (!navigator.onLine) { if (manual) toast(\"オフラインです。前回取得したデータを表示しています\"); return; }\n  adminLoading = true; if ($(\"#adminState\")) $(\"#adminState\").textContent = \"取得中…\";\n  try {\n    const res = await post({ ...auth(), admin: true });\n    if (!res || !res.ok) throw new Error((res && SERR[res.error]) || \"サーバーエラー\");\n    ADMIN = { t: Date.now(), stats: res.stats || {}, users: res.users || [], pwset: res.pwset || [], pending: res.pending || [], reports: res.reports || [] };\n    SHARED = { t: ADMIN.t, stats: ADMIN.stats };\n    try { localStorage.setItem(AKEY, JSON.stringify(ADMIN)); localStorage.setItem(SKEY, JSON.stringify(SHARED)); } catch (e) {}\n    if (manual) toast(\"最新にしました\");\n  } catch (e) { toast(\"取得できませんでした（\" + (e.name === \"AbortError\" || e instanceof TypeError ? \"つながりませんでした\" : e.message) + \"）\"); }\n  adminLoading = false;\n  if (!adminPicked) ad BYID[qid].source : qid)}<\/div>\n    <div style=\"margin-bottom:6px\">報告の種類<\/div>\n    ${types.map((t, i) => `<label style=\"display:block;padding:6px 0\"><input type=\"radio\" name=\"rtype\" value=\"${i}\"${i === 0 ? \" checked\" : \"\"}> ${t}<\/label>`).join(\"\")}\n    <textarea id=\"rComment\" placeholder=\"くわしく教えてもらえると助かります（省略可）\" style=\"width:100%;margin-top:10px;box-sizing:border-box;font-size:16px\" maxlength=\"200\" rows=\"3\"><\/textarea>\n    <div class=\"grid2\" style=\"margin-top:10px\">\n      <button class=\"primary\" id=\"rSend\">送る<\/button>\n      <button id=\"rCancel\">やめる<\/button>\n    <\/div>`;\n  document.body.appendChild(d);\n  if (typeof d.showModal === \"function\") d.showModal(); else { d.classList.add(\"fallback\"); d.setAttribute(\"open\", \"\"); }\n  d.querySelector(\"#rCancel\").onclick = () => d.remove();\n  d.querySelector(\"#rSend\").onclick = async () => {\n    const btn = d.querySelector(\"#rSend\");\n    btn.disabled = true;\n    const idx = +(d.querySelector(\"input[name=rtype]:checked\")?.value ?? 0);\n    const type = types[idx] || types[0];\n    const comment = d.querySelector(\"#rComment\").value.trim().slice(0, 200);\n    try {\n      await sendReport(qid, type, comment);\n      toast(\"ご報告ありがとうございます\");\n    } catch (e) {\n      toast(\"送信できませんでした（\" + (e instanceof TypeError ? \"つながりませんでした\" : e.message) + \"）\");\n      btn.disabled = false; return;\n    }\n    d.remove();\n  };\n}\n// 苦手な問題：解答が少ない問題は外し、正答率の低い順\nfunction adminHard() {\n  const st = ADMIN.stats || {}, nUsers = (ADMIN.users || []).length;\n  const minN = nUsers >= 5 ? 3 : 1;\n  return Object.entries(st).filter(([id, s]) => BYID[id] && s[0] >= minN && s[1] < s[0])\n    .map(([id, s]) => ({ q: BYID[id], s, r: s[1] / s[0] }))\n    .sort((a, b) => a.r - b.r || b.s[0] - a.s[0]).slice(0, 30);\n}\n// 管理者画面はタブで切り替える（やること／クラス全体／苦手な問題／学籍番号）。やることがあるときは最初にそれを開く\nlet adminTab = null, adminPicked = false;\nfunction renderAdmin(keepScroll) {\n  document.querySelector(\ etry-wrong\"() { const s = S.session; let n = 0; s.ids.forEach(id => { if (BYID[id] && s.revealed[id] && !isCorrect(BYID[id], s.answers[id] || []) && !has(S.retry, id)) { S.retry.push(id); n++; } }); save(); toast(`${n}問をリトライに追加しました`); },\n  home() { trackPause(); renderHome(); },\n  \"stats-all\"() { const fs = [...new Set(BANK.map(q => q.field || \"\"))].filter(f => new Set(BANK.filter(q => (q.field || \"\") === f).map(q => q.category)).size > 1);\n    const open = fs.every(f => statsOpen.has(f)); fs.forEach(f => open ? statsOpen.delete(f) : statsOpen.add(f)); renderStats(true); },\n  \"list-retry\"() { renderList(\"retry\"); },\n  \"list-excluded\"() { renderList(\"excluded\"); },\n  \"list-memo\"() { renderList(\"memo\"); },\n  \"list-start\"() { const ids = listKind === \"memo\" ? Object.keys(S.memos).filter(id => S.memos[id] && BYID[id]) : S[listKind].filter(id => BYID[id]); startSession(shuffle(ids), listKind === \"memo\" ? \"メモした問題\" : \"リトライ問題\"); },\n  data() { renderData(); },\n  stats() { renderStats(); },\n  tips() { renderTips(); },\n  \"tip-wrong\"() { startSession(shuffle(BANK.filter(q => q.field !== YOSOKU && !S.excluded.includes(q.id) && S.progress[q.id] && S.progress[q.id].last === false).map(q => q.id)), \"前回まちがえた問題\"); },\n  \"tip-random\"() { startSession(shuffle(BANK.filter(q => q.field !== YOSOKU && !S.excluded.includes(q.id)).map(q => q.id)).slice(0, 50), \"全分野から50問\"); },\n  search() { renderSearch(); },\n  \"search-start\"() { startSession(searchHits.map(q => q.id), `検索「${searchQ.trim()}」`); },\n  \"import-add\"() { importMode = \"add\"; pickFile(onImportQuestions); },\n  \"import-replace\"() { importMode = \"replace\"; pickFile(onImportQuestions); },\n  \"export-questions\"() { download(\"st-drill-questions.json\", BANK); },\n  \"clear-imported\"() { if (confirm(\"読み込んだ JSON の問題を削除しますか？（questions.js の問題は残ります）\")) { S.imported = []; save(); loadBank(); renderData(); } },\n  \"export-progress\"() { const { imported, account, outbox, ud, ...rest } = S; /* パスワードは書き出さない */ download(`st-drill-backup-${new Date().toISOString().slice(0, 10)}.json`, Object.assign({ app: \"st-drill\", version: 1 }, rest, { imported })); },\n  \"import-progress\"() { pickFile(d => { if (!d || d.app !== \"st-drill\") { alert(\"このアプリのバックアップファイルではありません\"); return; } delete d.app; delete d.version; delete d.ud; S = Object.assign(blank(), d, { account: S.account, outbox: S.outbox, ud: S.ud }); /* ログインはそのまま */ save(); loadBank(); toast(\"復元しました\"); renderData(); }); },\n  \"export-csv\"() {\n    const cell = v => `\"${String(v ?? \"\").replace(/\"/g, '\"\"')}\"`;\n    const lines = [[\"日時\", \"問題ID\", \"分野\", \"カテゴリ\", \"出典\", \"選んだ解答\", \"正答\", \"正誤\", \"回答時間(秒)\", \"最初に選んだ番号\", \"選び直し回数\", \"自己評価\"].map(cell).join(\",\")];\n    allHist().sort((a, b) => a.r.t - b.r.t).forEach(({ q, r }) => {\n      const d = new Date(r.t);\n      lines.push([`${fmtDate(r.t)} ${String(d.getHours()).padStart(2, \"0\")}:${String(d.getMinutes()).padStart(2, \"0\")}`, q.id, q.field, q.category, q.source,\n        r.a.join(\"・\"), q.answer.join(q.anyOf ? \"or\" : \"・\"), r.ok ? \"正解\" : \"不正解\", r.sec, r.first, r.ch, r.ev].map(cell).join(\",\"));\n    });\n    const blob = new Blob([\"\\ufeff\" + lines.join(\"\\r\\n\")], { type: \"text/csv\" });\n    const a = document.createElement(\"a\"); a.href = URL.createObjectURL(blob); a.download = `st-drill-history-${new Date().toISOString().slice(0, 10)}.csv`;\n    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n  },\n  sync() { sync({ stats: true, manual: true }); },\n  \"check-update\"() { checkUpdate(true); },\n  \"first-load\"() { checkUpdate(); },\n  \"apply-update\"() { save(); location.reload(); },\n  \"later-update\"() { const b = $(\"#updBar\"); if (b) b.remove(); },\n  admin() { adminTab = null; adminPicked = false; renderAdmin(); fetchAdmin(); },\n  \"admin-refresh\"() { fetchAdmin(true); },\n  \"admin-start\"() { startSession(adminHard().map(x => x.q.id), \"みんなが苦手な問題\"); },\n  login: doLogin,\n  async logout() {\n    if ((S.outbox.length || Object.keys(S.ud.dirty).length) && CLASS.url && navigator.onLine) { toast(\"未送信の記録を送っています…\"); await sync(); }  // 先に送れる分は送る\n    const n = S.outbox.length + (CLASS.url ? Object.keys(S.ud.dirty).length : 0);\n    if (!confirm((n ? `まだ送信できていない記録が${n}件あります（ログアウトすると消えます）。\\n` : \"\") + (CLASS.url ? \"ログアウトすると、この端末の学習記録を消します。同じ学籍番号でログインし直せば、送信済みの記録は戻ります。ログアウトしますか？\" : \"ログアウトすると、この端末の学習記録を消します。よろしいですか？\"))) return;\n    const settings = S.settings; S = blank(); S.settings = settings; save(); loadBank();\n    ADMIN = {}; try { localStorage.removeItem(AKEY); } catch (e) {}  // 管理者のデータを端末に残さない\n    renderHome();\n  },\n  \"reset-progress\"() { if (confirm(\"正答記録（正答率・前回の正誤）をすべて消しますか？\")) { S.progress = {}; save(); toast(\"リセットしました\"); } },\n  \"reset-all\"() { if (confirm(\"この端末の学習記録・メモ・読み込んだ問題をすべて消します（ログインはそのまま）。よろしいですか？\")) { const ac = S.account, ud = S.ud; S = blank(); if (ac) { S.account = Object.assign(ac, { cursor: ac.cursor }); S.ud = ud; if (CLASS.url) udDiff(Date.now(), true); } save(); loadBank(); renderHome(); } }\n};\nfunction onImportQuestions(data) {\n  try {\n    const arr = validQuestions(data);\n    S.imported = importMode === \"replace\" ? arr : (S.imported || []).concat(arr);\n    save(); loadBank(); toast(`${arr.length}問を読み込みました`); renderData();\n  } catch (e) { alert(\"読み込めませんでした：\" + e.message); }\n}\ndocument.addEventListener(\"click\", e => {\n  const fig = e.target.closest(\"[data-fig]\"); if (fig) return fig.classList.toggle(\"zoom\");\n  const so = e.target.closest(\"[data-sopen]\"); if (so && !e.target.closest(\"button\")) { const f = so.dataset.sopen; statsOpen.has(f) ? statsOpen.delete(f) : statsOpen.add(f); return renderStats(true); }\n  const ao = e.target.closest(\"[data-aopen]\"); if (ao) { const f = ao.dataset.aopen; adminOpen.has(f) ? adminOpen.delete(f) : adminOpen.add(f); return renderAdmin(true); }\n  const b = e.target.closest(\"button, h1\"); if (!b) return;\n  if (b.id === \"homeLink\") { trackPause(); return renderHome(); }\n  const d = b.dataset;\n  if (d.act && actions[d.act]) return actions[d.act]();\n  if (d.cat) { pickedCats.has(d.cat) ? pickedCats.delete(d.cat) : pickedCats.add(d.cat); return renderHome(true); }\n  if (d.resetpw) return resetPw(d.resetpw);\n  if (d.approve) return approve(d.approve);\n  if (d.resolve != null) return resolveReport(+d.resolve);\n  if (d.atab) { adminTab = d.atab; adminPicked = true; return renderAdmin(); }\n  if (d.tipcat) return tipStart(d.tipcat);\n  if (d.ssort) { statsSort = d.ssort; return renderStats(); }\n  if (d.open != null) { openFields.has(d.open) ? openFields.delete(d.open) : openFields.add(d.open); return renderHome(true); }\n  if (d.field) { const ks = categories().filter(k => k.split(\"|\")[0] === d.field); const all = ks.every(k => pickedCats.has(k));\n    ks.forEach(k => all ? pickedCats.delete(k) : pickedCats.add(k)); return renderHome(true); }\n  if (d.set) { S.settings[d.set] = d.set === \"count\" ? +d.val : d.val; save(); return renderHome(true); }\n  if (d.year != null) { const y = S.settings.years || []; S.settings.years = !d.year ? [] : y.includes(d.year) ? y.filter(x => x !== d.year) : y.concat(d.year).sort().reverse(); save(); return renderHome(true); }\n  if (d.choice) {\n    const n = +d.choice; const q = BYID[S.session.ids[S.session.idx]];\n    const tr = TRACK[q.id], o = toOrig(S.session, q, n);  // selected は表示の番号、選び直しの記録（picks）は元の番号\n    const pick = () => { if (tr && tr.picks[tr.picks.length - 1] !== o) tr.picks.push(o); };\n    if (q.answer.length > 1 && !q.anyOf) { selected = selected.includes(n) ? selected.filter(x => x !== n) : selected.concat(n); if (tr) tr.picks.push(o); }\n    else if (q.anyOf) { const add = !selected.includes(n); selected = add ? selected.concat(n).slice(-q.answer.length) : selected.filter(x => x !== n); if (add) pick(); }\n    else { selected = selected[0] === n ? [] : [n]; if (selected.length) pick(); }\n    return renderQuiz(true);\n  }\n  if (d.ev) {\n    const p = S.progress[S.session.ids[S.session.idx]]; const last = p && p.hist && p.hist[p.hist.length - 1];\n    if (last) { last.ev = last.ev === d.ev ? \"\" : d.ev; save(); }\n    return renderQuiz(true);\n  }\n  if (d.jump != null) { const s = S.session; s.finished = false; return goto(+d.jump); }\n  if (d.remove) { toggleIn(listKind, d.remove); return renderList(listKind); }\n  if (d.one) return startSession([d.one], \"1問演習\");\n});\n\n// 戻るボタン（Android・ブラウザ）：ホーム以外の画面ではひとつ履歴を足しておき、戻るでホームへ（アプリが閉じないように）\nfunction navPush() { try { if (!(history.state && history.state.st)) history.pushState({ st: 1 }, \"\"); } catch (e) {} }\nwindow.addEventListener(\"popstate\", () => {\n  if ($(\"#memoDialog\").open) { $(\"#memoDialog\").close(); return navPush(); }\n  const rd = document.querySelector(\"dialog.reportDlg\"); if (rd) { rd.remove(); return navPush(); }\n  trackPause(); save(); renderHome();\n});\n[\"renderStats\", \"renderTips\", \"renderSearch\", \"renderList\", \"renderData\", \"renderAdmin\", \"renderResult\"].forEach(n => {\n  const f = window[n]; if (typeof f === \"function\") window[n] = function () { navPush(); return f.apply(this, arguments); };\n});\n// メモ\nlet memoId = null;\n// 古い Safari（15.3 以前）などで <dialog> が使えないときの代わり\n(d => { if (typeof d.showModal !== \"function\") { d.classList.add(\"fallback\"); d.showModal = () => d.setAttribute(\"open\", \"\"); d.close = () => { d.removeAttribute(\"open\"); d.dispatchEvent(new Event(\"close\")); }; } })($(\"#memoDialog\"));\nfunction openMemo(id) { memoId = id; $(\"#memoText\").value = S.memos[id] || \"\"; $(\"#memoQ\").textContent = BYID[id] ? BYID[id].category : \"\"; $(\"#memoDialog\").showModal(); }\n$(\"#memoText\").addEventListener(\"input\", () => { const v = $(\"#memoText\").value; if (v.trim()) S.memos[memoId] = v; else delete S.memos[memoId]; save(); });\n$(\"#memoClose\").addEventListener(\"click\", () => $(\"#memoDialog\").close());\n$(\"#memoDialog\").addEventListener(\"close\", () => { if (S.session && document.querySelector(\"[data-act=memo]\")) renderQuiz(true); });\n\n// キーボード（PC用）：1〜5で選択、Enterで解答／次へ、←→で前／次の問題\ndocument.addEventListener(\"keydown\", e => {\n  if ($(\"#memoDialog\").open || document.querySelector(\"dialog.reportDlg\") || !S.session || !document.querySelector(\".choices\")) return;\n  if (/^[1-9]$/.test(e.key)) { const b = document.querySelector(`[data-choice=\"${e.key}\"]:not([disabled])`); if (b) b.click(); }\n  else if (e.key === \"Enter\") { const b = document.querySelector(\"[data-act=answer], [data-act=next]\"); if (b) { e.preventDefault(); b.click(); } }\n  else if (e.key === \"ArrowLeft\") { const b = document.querySelector(\"[data-act=prev]:not([disabled])\"); if (b) b.click(); }\n  else if (e.key === \"ArrowRight\") { const s = S.session; const b = document.querySelector(\"[data-act=next]\");\n    if (b) b.click(); else if (s.idx + 1 < s.ids.length) goto(s.idx + 1); }\n});\n\n// 端末の空き容量が少ないときでも記録を消されにくくする（Chrome・Android・新しい Safari）\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\n// LINE・Instagram などのアプリの中のブラウザは、記録が消えやすく、ホーム画面にも追加できないので、普通のブラウザで開くよう案内する\nconst INAPP = /Line\\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger|KAKAOTALK/i.test(navigator.userAgent);\nif (INAPP) { const n = document.createElement(\"div\"); n.className = \"inapp\";\n  n.innerHTML = `アプリの中のブラウザで開いています。記録が消えることがあるので、右上（または下）のメニューから「ブラウザで開く」（iPhone は Safari、Android は Chrome）を選んでください。`;\n  document.querySelector(\".wrap\").insertBefore(n, document.querySelector(\"main\")); }\nrenderHome();\nsync().then(() => checkUpdate());\nwindow.addEventListener(\"online\", () => sync().then(() => checkUpdate()));\nsetInterval(() => { sync(); checkUpdate(); }, 5 * 60 * 1000);\n<\/script>\n<\/body>\n<\/html>\n"</script>
